name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Generate Persistent Signing Keystore
      run: |
        mkdir -p ~/.android
        rm -f ~/.android/debug.keystore
        keytool -genkeypair -v \
          -keystore app/persistent-release-key.jks \
          -alias english_tutor_key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass EnglishTutor2026 \
          -keypass EnglishTutor2026 \
          -dname "CN=EnglishTutor, OU=Mobile, O=EnglishTutorPro, L=Jerusalem, S=IL, C=IL"

    - name: Build Upgradable Signed APK
      env:
        VERSION_CODE: ${{ github.run_number }}
      run: gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnglishTutor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
